name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      build_all:
        description: 'Build all platforms'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================
  # macOS Build
  # ============================================================
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Get version
        id: version
        run: |
          VERSION=$(cat App/VERSION | tr -d '[:space:]')
          # If triggered via workflow_dispatch, use that version
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build macOS DMG
        run: |
          cd App
          chmod +x release.sh
          bash release.sh macos
        env:
          CGO_ENABLED: 1

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homestyle-Plate-macos
          path: releases/*.dmg
          retention-days: 30

  # ============================================================
  # Linux Build (x86_64)
  # ============================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install gcc (for CGO/SQLite)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev

      - name: Get version
        id: version
        run: |
          VERSION=$(cat App/VERSION | tr -d '[:space:]')
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build Linux tarball
        run: |
          cd App
          chmod +x release.sh
          bash release.sh linux-amd64
        env:
          CGO_ENABLED: 1
          CC: gcc

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homestyle-Plate-linux-amd64
          path: releases/*.tar.gz
          retention-days: 30

  # ============================================================
  # Linux Build (ARM64)
  # ============================================================
  build-linux-arm64:
    name: Build Linux (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Get version
        id: version
        run: |
          VERSION=$(cat App/VERSION | tr -d '[:space:]')
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Linux ARM64 tarball
        run: |
          cd App
          chmod +x release.sh
          bash release.sh linux-arm64
        env:
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
          GOARCH: arm64

      - name: Upload Linux ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homestyle-Plate-linux-arm64
          path: releases/*linux-arm64*.tar.gz
          retention-days: 30

  # ============================================================
  # Windows Build (x86_64)
  # ============================================================
  build-windows:
    name: Build Windows (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Get version
        id: version
        run: |
          VERSION=$(cat App/VERSION | tr -d '[:space:]')
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows ZIP
        run: |
          cd App
          chmod +x release.sh
          bash release.sh windows-amd64
        env:
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          GOOS: windows
          GOARCH: amd64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Homestyle-Plate-windows-amd64
          path: releases/*.zip
          retention-days: 30

  # ============================================================
  # Create GitHub Release
  # ============================================================
  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(cat App/VERSION | tr -d '[:space:]')
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Homestyle Plate v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/Homestyle-Plate-macos/*.dmg
            artifacts/Homestyle-Plate-linux-amd64/*.tar.gz
            artifacts/Homestyle-Plate-linux-arm64/*.tar.gz
            artifacts/Homestyle-Plate-windows-amd64/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
